services:
  - type: web
    name: bethuel-sang-portfolio
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORTFOLIO_STORAGE
        value: /app/storage
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: portfolio-storage
      mountPath: /app/storage
      sizeGB: 1
